<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tape 07 ✨ For Shaaaw</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%);
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(225, 29, 72, 0.15);
    }
    .loader {
      width: 54px;
      height: 54px;
      border: 4px solid #ffe4e6;
      border-top-color: #e11d48;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      display: inline-block;
      background: #ffe4e6;
      color: #e11d48;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.35rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { color: #64748b; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">✨ TAPE 07 &bull; LIFETIME VAULT ✨</span>
    <div class="loader"></div>
    <h1>Opening Tape 07...</h1>
    <p>Connecting to Shaaaw's birthday memory archive...</p>
    <a href="https://birthday-qr-memory-system.onrender.com/memory/7" class="btn" id="goBtn">▶ Open Memory Now</a>
  </div>
  <script>
    (async function() {
      let target = 'https://birthday-qr-memory-system.onrender.com/memory/7';
      try {
        const res = await fetch('../config.json?t=' + Date.now());
        if (res.ok) {
          const cfg = await res.json();
          if (cfg && cfg.targetBaseUrl) {
            target = cfg.targetBaseUrl.replace(/\/+$/, '') + '/memory/7';
          }
        }
      } catch(e) {}
      const btn = document.getElementById('goBtn');
      if (btn) btn.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
